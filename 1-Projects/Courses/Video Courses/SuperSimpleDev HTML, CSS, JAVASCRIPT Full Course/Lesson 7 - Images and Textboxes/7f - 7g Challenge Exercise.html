<!DOCTYPE html>
<html>
    <head>
        <title>Text Box Challenge Exercise</title>
        <style>
            /* ----- Lame LinkedIn Styles LOL 🥱 ----- */

            p {
                color: gray;
                font-family: Arial, serif;
                font-size: 14px;
            }

            .linkedin_button {
                color: white;
                background-color: rgb(0, 105, 255);
                padding-right: 130px;
                padding-left: 130px;
                padding-top: 10px;
                padding-bottom: 10px;
                border: none;
                border-radius: 50px;
                font-size: 20px;
            }

            input {
                width: 360px;
                height: 28px;
                border: 2px solid gray;
                border-radius: 5px;
            }

            /* ----- Twitter text Box Styles Below 🐦 ---- */

            .avatar {
                width: 70px;
                height: 70px;
                object-fit: cover;
                border-radius: 50px;
                vertical-align: middle;
            }

            .twittertext {
                border: none;
                font-size: 17px;
                vertical-align: middle;
                margin-left: 5px;
            }

            .tweetbutton {
                color: white;
                border: none;
                border-radius: 20px;
                background-color: rgb(0, 145, 255);
                padding-top: 10px;
                padding-right: 20px;
                padding-left: 20px;
                padding-bottom: 10px;
                font-size: 18px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <h1 style="color: red; font-family: Arial; text-decoration: underline;">Challenge Exercises</h1>

        <div>
            <h2 style="font-family: Arial;">7f. LinkedIn signup</h2>
            <p>Email</p>
            <input type="text">
            <p style="margin-left: 5px;">By clicking Agree & Join, you agree to the Privacy Policy.</p>
            <button class="linkedin_button">Agree & Join</button>
        </div>

        <br>
        <br>
        <br>
        <!-- I'm so proud of myself yaaaaaaas girl!!!! 😍 -->
        <br>
        <br>
        <br>

        <div>
            <h2 style="font-family: Arial">7g. Twitter text box</h2>
            <img class="avatar" src="https://res.cloudinary.com/upwork-cloud/image/upload/c_scale,w_1000/v1709231875/catalog/1651091894095220736/sixwojgeb6vjtkv88pub.webp">
            <input class="twittertext" type="text" placeholder="What's happening?">
            <button class="tweetbutton">Tweet</button>
        </div>
    </body>
</html>
