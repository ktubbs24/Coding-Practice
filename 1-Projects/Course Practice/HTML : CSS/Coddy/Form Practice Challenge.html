<!DOCTYPE html>
<html>
    <head>
        <style>
            #practiceForm { 
                display: inline-block; 
                margin-left: 100px;
                padding: 20px; 
                background-color: rgba(255, 133, 244, 0.5); 
                color: white; 
                text-decoration: underline; 
                border-radius: 20px; 
                box-shadow: 5px  30px 120px 50px rgba(247, 11, 125, 0.5); 
                cursor: pointer; 
            }

            h1 { 
                margin-left: 50px; 
                color: lightgray; 
            
            }
        </style>
        <title>My practice Form :)</title>
    </head>
    <body>
        <!-- Write code below this line -->
         <h1>Just a test form for practice</h1>
        <form id="practiceForm" action="https://jsonplaceholder.typicode.com/todos" method="POST">
            <input type="text" name="firstName" id="firstName" placeholder="First Name">
                <label for="firstName" id="firstNameLabel">First Name</label><hr><br>
            <input type="text" name="lastname" id="lastName" placeholder="Last Name">
                <label for="lastName" id="lastNameLabel">Last Name</label><hr><br>
            <input type="email" name="email" id="email" placeholder="Your email">
                <label for="email" id="emailLabel">Email</label><hr><br>
            <input type="number" name="age" id="age" placeholder="Your Age" min="0">
                <label for="age" id="ageLabel"></label>Age<hr><br>
            <input type="radio" name="gender" id="male" value="Male">
                <label for="male" id="maleLabel">Male</label><hr><br>
            <input type="radio" name="gender" id="female" value="Female">
                <label for="female" id="femaleLabel">Female</label><hr><br>
            <input type="range" name="satisfaction" id="satisfaction" min="0" max="100">
                <label for="satisfaction" id="satisfactionLabel">Satisfaction</label><hr><br>
            <input type="submit" id="submit">
        </form>
        
    </body>
</html>
