<!DOCTYPE html>
     <html>
         <head>
             <title>New product landing page exercise</title>
         </head>
         <body>
             <header style="background-color: #ffca3a;">
                 <h1>New Awesome Product</h1>
             </header>
            <main>
                <p>Introducing this latest product designed 
                   to make life more interesting and efficient.</p>
                <ul>
                    <li>Item 1</li>
                    <li>Item 2</li>
                    <li>Item 3</li>
                </ul>
                <h2 style="background-color: blue; color: white;">Order Now!</h2>
                <form>
                    <label for="size">Size:</label>
                    <select id="size">
                        <option>Small</option>
                        <option>Medium</option>
                        <option>Large</option>
                    </select>
                    <label for="color">Color:</label>
                    <select>
                        <option>Red</option>
                        <option>Blue</option>
                        <option>Green</option>
                    </select>
                    <br>
                    <br>
                    <label for="name">Name:</label>
                    <input type="text" name="name" value="name" id="name"><br>
                    <label for="email">Email:</label>
                    <input type="email" name="email" value="email" id="email"><br>
                    <br>
                   <button onclick="alert('Order Confirmed!')" style="color: white; background-color: blue; border: none; border-radius: 5px;" >Submit</button>
                </form>
            </main>
            
            <footer style="background-color: #ffca3a; text-align: center; text-weight: bold;">
                <p>Made with <3</p>
            </footer>              
         </body>
    </html>
