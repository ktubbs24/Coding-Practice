<!DOCTYPE html>
<head>
    <title>I love CSS</title>
    <style>
        #b1 {
            height: 80px;
            background-color: black;
            display: inline-block; 
            padding: 5px 10px 120px 10px;
            box-sizing: border-box;
        }

        #b2 { 
            display: flex; 
            margin-top: 20px; 
            margin-left: 15px; 
            color: white; 
        }

        #b3 { 
            color: red; 
            margin-top: 10px;
            margin-left: 12px;
        }

        #b4 {
            width: 40px;
            display: flex; 
            text-align: center;
            margin-top: 10px; 
            color: white; 
            box-sizing: border-box; 
        }

        #b5, #b6, #b7 { 
            display: flex; 
            border: 1px dotted white;
            align-items: center;
            justify-content: space-between;
            margin-right: 3px;
            width: 30px; 
            height: 30px;
        }
    </style>
</head>
<body>
    <div id="b1">
        <div id="b2">
            <span>I</span>
        </div>
        <div id="b3">
            <span>❤</span>
        </div>
        <div id="b4">
            <div id="b5">
                <span>C</span>
            </div>
            <div id="b6">
                <span>S</span>
            </div>
            <div id="b7">
                <span>S</span>
            </div>
        </div>
    </div>
</body>
</html>
