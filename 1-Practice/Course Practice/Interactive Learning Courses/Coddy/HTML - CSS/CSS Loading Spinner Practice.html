<!DOCTYPE html>
<html>
<head>
  <style>
    #spinner { 
    width: 100px; 
    height: 100px;

    border-width: 12px; 
    border-style: dotted; 
    border-color: rgb(7, 173, 120) transparent blue transparent;
    border-radius: 50%;  

    animation: green_spinner 1.5s infinite; 
}

@keyframes green_spinner { 
    from { 
        transform: rotate(0deg);
        opacity: 100%; 
    }
    to { 
        transform: rotate(360deg);
        opacity: 2%;                 
    }
}   
  </style>
</head>
<body>
    <div id="spinner"></div>
</body>
</html>
