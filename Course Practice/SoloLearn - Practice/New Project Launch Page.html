<!DOCTYPE html>
    <html>
        <head>
            <title>New product landing page exercise</title>
        </head>
        <body>
            <header>
                <h1>New Awesome Product</h1>
            </header>
           <main>
               <p>Introducing this latest product designed 
                  to make life more interesting and efficient.</p>
               <ul>
                   <li>Item 1</li>
                   <li>Item 2</li>
                   <li>Item 3</li>
               </ul>
               <h2>Order Now!</h2>
               <form>
                   <label for="size">Size:</label>
                   <select id="size">
                       <option>Small</option>
                       <option>Medium</option>
                       <option>Large</option>
                   </select>
                   <label for="color">Color:</label>
                   <select>
                       <option>Red</option>
                       <option>Blue</option>
                       <option>Green</option>
                   </select>
                   <br>
                   <br>
                   <label for="name">Name:</label>
                   <input type="text" name="name" value="name" id="name"><br>
                   <label for="email">Email:</label>
                   <input type="email" name="email" value="email" id="email"><br>
                   <br>
                   <input type="submit">
               </form>
           </main>
           <footer>
               Made with <3 
           </footer>              
        </body>
   </html>
