<!DOCTYPE html>
<html>
    <head>
        <title>Image Manipulation Practice</title>
        <style>
                .pic1 { 
                width: 200px;
                border-radius: 20px;
                }

                .pic2 { 
                width: 200px;
                height: 200px;
                object-fit: cover;
                margin-left: 50px;
                }

                .pic3 { 
                width: 100px;
                height: 100px;
                border-radius: 50px;
                object-fit: cover;
                margin-left: 50px;
                }
        </style>
    </head>
    <body>
        <img class="pic1" src="https://images.pexels.com/photos/669502/pexels-photo-669502.jpeg?cs=srgb&dl=pexels-goumbik-669502.jpg&fm=jpg">
        <img class="pic2" src="https://images.pexels.com/photos/669502/pexels-photo-669502.jpeg?cs=srgb&dl=pexels-goumbik-669502.jpg&fm=jpg">
        <img class="pic3" src="https://images.pexels.com/photos/669502/pexels-photo-669502.jpeg?cs=srgb&dl=pexels-goumbik-669502.jpg&fm=jpg">
    </body>
</html>
