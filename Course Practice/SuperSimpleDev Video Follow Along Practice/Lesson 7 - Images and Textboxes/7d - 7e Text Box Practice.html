<!DOCTYPE html> 
<html>
    <head>
        <title>Text box practice</title>
        <style>
                .firstbox { 
                font-size: 18px;
                border-radius: 10px;
                border: 1px solid lightgray;
                padding: 9px;
                }


                .secondbox { 
                width: 400px;
                padding: 10px;
                border: none; 
                border-radius: 20px;
                box-shadow: 1px 1px 5px 1px lightgray; 

                }
        </style>
    </head>
    <body>
        <div>
            <h3 style="font-family: Arial;">7d. With rounded corners</h3>
              <input class="firstbox" type="text" placeholder="Search"> 
        </div>
            
            
            <div>
                <h3 style="font-family: Arial;">7e. With a shadow, and no border</h3>
                <input class="secondbox" type="text" placeholder="Search Google or type a URL">
            </div>
    </body>
</html>
